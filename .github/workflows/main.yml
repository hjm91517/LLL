name: Build Dylib

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner 标签（官方：macos-15 / macos-26 / macos-latest）'
        default: 'macos-15'
      archs:
        description: '目标架构'
        default: 'arm64 arm64e'
      deployment_target:
        description: 'iOS 最低版本'
        default: '14.0'
      package_scheme:
        description: 'rootful / rootless / roothide'
        default: 'rootful'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Print runner info
        run: |
          echo "runner OS  : $RUNNER_OS"
          echo "runner arch: $RUNNER_ARCH"
          sw_vers
          xcodebuild -version || true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve config
        run: |
          echo "ARCHS=${{ inputs.archs || 'arm64 arm64e' }}"        >> $GITHUB_ENV
          echo "IOS_DT=${{ inputs.deployment_target || '14.0' }}"   >> $GITHUB_ENV
          echo "PKG_SCHEME=${{ inputs.package_scheme || 'rootful' }}" >> $GITHUB_ENV

      - name: Install host deps
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ldid xz dpkg || brew upgrade ldid xz dpkg
          ldid -v 2>&1 | head -n 2 || true

      - name: Cache Theos + SDKs
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-v4

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          ls -1 "$THEOS/sdks"

      - name: Precheck project layout
        run: |
          set -euo pipefail
          echo "--- 根目录 ---"
          ls -la
          if [ ! -f Makefile ] && [ -f Makefile.make ]; then
            echo "!! 发现 Makefile.make 但缺 Makefile，自动改名"
            mv Makefile.make Makefile
          fi
          test -f Makefile || { echo "!! 没有 Makefile，无法构建"; exit 1; }
          echo "--- Makefile 头部 ---"
          head -n 20 Makefile

      - name: Build (Theos)
        run: |
          set -euo pipefail
          EXTRA=""
          case "$PKG_SCHEME" in
            rootless) EXTRA="THEOS_PACKAGE_SCHEME=rootless" ;;
            roothide) EXTRA="THEOS_PACKAGE_SCHEME=roothide" ;;
          esac

          make clean || true
          make all \
            FINALPACKAGE=1 DEBUG=0 \
            ARCHS="$ARCHS" \
            TARGET="iphone:clang:latest:$IOS_DT" \
            $EXTRA

          echo "--- 打包（尽力而为，失败不影响 dylib）---"
          make package \
            FINALPACKAGE=1 DEBUG=0 \
            ARCHS="$ARCHS" \
            TARGET="iphone:clang:latest:$IOS_DT" \
            $EXTRA || echo "!! package 跳过"

      - name: Collect & sign
        run: |
          set -euo pipefail
          mkdir -p dist
          ENT=""
          [ -f ".github/entitlements.plist" ] && ENT=".github/entitlements.plist"

          echo "--- .theos/obj 产物 ---"
          find .theos -name '*.dylib' -print 2>/dev/null || true

          found=0
          while IFS= read -r -d '' f; do
            out="dist/$(basename "$f")"
            cp -f "$f" "$out"
            if [ -n "$ENT" ]; then ldid -S"$ENT" "$out"; else ldid -S "$out"; fi
            echo "== $out"
            lipo -info "$out" || true
            otool -L "$out" | head -20 || true
            found=$((found+1))
          done < <(find . -name '*.dylib' -not -path './dist/*' -not -path './.git/*' -print0)

          find . -name '*.deb' -not -path './.git/*' -exec cp -f {} dist/ \; 2>/dev/null || true

          echo "--- dist ---"
          ls -la dist
          test "$found" -gt 0 || { echo "!! 一个 dylib 都没生成"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
