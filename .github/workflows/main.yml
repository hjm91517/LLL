name: Build Dylib

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner 标签（官方：macos-15 / macos-26；自建：写你自己的）'
        default: 'macos-15'
      archs:
        description: '目标架构'
        default: 'arm64 arm64e'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Print runner info
        run: |
          echo "runner OS : $RUNNER_OS"
          echo "runner arch: $RUNNER_ARCH"
          uname -a
          sw_vers
          xcodebuild -version || true
          xcode-select -p

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve config
        run: |
          echo "ARCHS=${{ inputs.archs || 'arm64 arm64e' }}" >> $GITHUB_ENV
          echo "PKG_NAME=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_ENV

      - name: Install host deps
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ldid xz dpkg || brew upgrade ldid xz dpkg

      - name: Cache Theos + SDKs
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"

      - name: Build
        run: |
          set -euo pipefail
          if [ -f Makefile ] || [ -f makefile ]; then
            make clean || true
            make all FINALPACKAGE=1 DEBUG=0 ARCHS="$ARCHS" \
                 TARGET="iphone:clang:latest:12.0"
            make package FINALPACKAGE=1 DEBUG=0 ARCHS="$ARCHS" \
                 TARGET="iphone:clang:latest:12.0" || true
          else
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            SRC=$(find . \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cpp' \) \
                  -not -path './.theos/*' -not -path './dist/*' | tr '\n' ' ')
            AF=""
            for a in $ARCHS; do AF="$AF -arch $a"; done
            mkdir -p dist
            xcrun --sdk iphoneos clang $AF -miphoneos-version-min=12.0 \
              -isysroot "$SDK" -dynamiclib -fobjc-arc -fmodules -O2 \
              -undefined dynamic_lookup \
              -install_name "@executable_path/$PKG_NAME.dylib" \
              -o "dist/$PKG_NAME.dylib" $SRC
          fi

      - name: Collect & sign
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -name '*.dylib' -not -path './dist/*' -not -path './.git/*' -print0 |
          while IFS= read -r -d '' f; do
            cp -f "$f" "dist/$(basename "$f")"
            ldid -S "dist/$(basename "$f")"
            lipo -info "dist/$(basename "$f")" || true
          done
          find . -name '*.deb' -exec cp -f {} dist/ \; 2>/dev/null || true
          ls -la dist
          test "$(ls -A dist)" || { echo "!! 没产出"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
