name: Build Dylib

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner 标签（官方：macos-15 / macos-26 / macos-latest）'
        default: 'macos-15'
      archs:
        description: '目标架构'
        default: 'arm64 arm64e'
      deployment_target:
        description: 'iOS 最低版本'
        default: '14.0'
      package_scheme:
        description: 'rootful / rootless / roothide'
        default: 'rootful'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply v2 source patch
        run: |
          if [ -f tools/apply_v2.py ]; then python3 tools/apply_v2.py; fi
          for f in tools/fix*.py; do [ -e "$f" ] && python3 "$f"; done
          ls ui/LLLCloudLogin.m overlay/LLLMusicIsland.m >/dev/null

      - name: Print runner info
        run: |
          echo "runner OS  : $RUNNER_OS"
          echo "runner arch: $RUNNER_ARCH"
          sw_vers
          xcodebuild -version || true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve config
        run: |
          echo "ARCHS=${{ inputs.archs || 'arm64 arm64e' }}"        >> $GITHUB_ENV
          echo "IOS_DT=${{ inputs.deployment_target || '14.0' }}"   >> $GITHUB_ENV
          echo "PKG_SCHEME=${{ inputs.package_scheme || 'rootful' }}" >> $GITHUB_ENV

      - name: Install host deps
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ldid xz dpkg || brew upgrade ldid xz dpkg
          ldid -v 2>&1 | head -n 2 || true

      - name: Cache Theos + SDKs
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-v4

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          ls -1 "$THEOS/sdks"

      - name: Precheck project layout
        run: |
          set -euo pipefail
          echo "--- 根目录 ---"
          ls -la
          test -f Makefile || { echo "!! 没有 Makefile，无法构建"; exit 1; }
          echo "--- Makefile 头部 ---"
          head -n 20 Makefile

      - name: Build (Theos)
        run: |
          set -euo pipefail
          EXTRA=""
          case "$PKG_SCHEME" in
            rootless) EXTRA="THEOS_PACKAGE_SCHEME=rootless" ;;
            roothide) EXTRA="THEOS_PACKAGE_SCHEME=roothide" ;;
          esac

          make clean || true
          make all \
            FINALPACKAGE=1 DEBUG=0 \
            ARCHS="$ARCHS" \
            TARGET="iphone:clang:latest:$IOS_DT" \
            $EXTRA

          echo "--- 打包 deb 已跳过（直接交付 dylib）---"

      - name: Collect & sign
        run: |
          set -uo pipefail
          mkdir -p dist

          ENT=""
          if [ -f ".github/entitlements.plist" ]; then ENT=".github/entitlements.plist"; fi

          echo "--- 候选 dylib ---"
          find . -name '*.dylib' \
               -not -path './dist/*' -not -path './.git/*' -not -path '*dSYM*' \
               | sort > /tmp/all_dylibs.txt || true
          cat /tmp/all_dylibs.txt

          : > /tmp/picked.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            b=$(basename "$f")
            if grep -qxF "$b" /tmp/picked.txt; then continue; fi
            echo "$b" >> /tmp/picked.txt

            best="$f"; bestn=0
            for c in $(grep "/$b\$" /tmp/all_dylibs.txt); do
              file "$c" | grep -q 'Mach-O' || continue
              n=$(lipo -archs "$c" 2>/dev/null | wc -w | tr -d ' ')
              if [ -n "$n" ] && [ "$n" -gt "$bestn" ]; then bestn=$n; best="$c"; fi
            done

            cp -f "$best" "dist/$b"
            echo "  $b  <=  $best  (archs=$bestn)"
          done < /tmp/all_dylibs.txt

          for f in dist/*.dylib; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            n=$(lipo -archs "$f" 2>/dev/null | wc -w | tr -d ' ')
            if [ -n "$n" ] && [ "$n" -le 1 ]; then
              slices=$(ls .theos/obj/*/"$b" 2>/dev/null || true)
              if [ -n "$slices" ]; then
                if lipo -create -output "$f" $slices 2>/dev/null; then
                  echo "  lipo 合并 $b -> $(lipo -archs "$f")"
                fi
              fi
            fi
          done

          echo "--- 签名 ---"
          for f in dist/*.dylib; do
            [ -e "$f" ] || continue
            if [ -n "$ENT" ]; then ldid -S"$ENT" "$f"; else ldid -S "$f"; fi
            echo "== $f"
            lipo -info "$f" || true
            otool -L "$f" | head -20 || true
          done

          VER=$(sed -n 's/.*kPluginVersion @"\([^"]*\)".*/\1/p' core/PluginInfo.h | head -1)
          [ -z "$VER" ] && VER=0.0
          for f in dist/*.dylib; do
            [ -e "$f" ] || continue
            cp -f "$f" "dist/bbhj-online-$VER.dylib"
          done
          echo "版本: $VER"

          find . -name '*.deb' -not -path './.git/*' -exec cp -f {} dist/ \; 2>/dev/null || true

          if [ -n "$(ls -A dist)" ]; then
            ( cd dist && zip -qry /tmp/LLL-bundle.zip . )
            cp -f /tmp/LLL-bundle.zip "dist/$(basename $GITHUB_REPOSITORY)-dylib.zip"
          fi

          echo "--- dist ---"
          ls -la dist
          test -n "$(ls -A dist | grep '\.dylib$')" || { echo "!! 一个 dylib 都没生成"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Persist patched sources
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name  "lll-ci"
          git config user.email "lll-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有源码变更"
          else
            git commit -m "ci: materialize v2 sources [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}" || true
          fi

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true

      - name: Report build log to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh run view "${{ github.run_id }}" --log-failed > /tmp/fail.log 2>&1 || \
            gh run view "${{ github.run_id }}" --log > /tmp/fail.log 2>&1 || true
          {
            echo '```'
            grep -nE "error:|fatal error|undefined symbol|No such file" /tmp/fail.log | head -40 || true
            echo '--- tail ---'
            tail -30 /tmp/fail.log || true
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body-file /tmp/body.md || true
