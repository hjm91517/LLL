name: Build Dylib

on:
  push:
    branches: [ main, master, v2 ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Apply live patch
        run: |
          if [ -f tools/v24.py ]; then python3 tools/v24.py || true; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install host deps
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ldid xz dpkg || brew upgrade ldid xz dpkg

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-v6

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build
        run: |
          set -euo pipefail
          make clean || true
          make all FINALPACKAGE=1 DEBUG=0 ARCHS="arm64 arm64e" \
            TARGET="iphone:clang:latest:14.0"

      - name: Collect & sign
        run: |
          set -uo pipefail
          rm -rf dist && mkdir -p dist
          ENT=""
          if [ -f ".github/entitlements.plist" ]; then ENT=".github/entitlements.plist"; fi
          best=$(ls -1 .theos/obj/bbhj_online.dylib .theos/obj/*/bbhj_online.dylib 2>/dev/null | head -1)
          [ -z "$best" ] && { echo "!! 没找到 dylib"; exit 1; }
          cp -f "$best" dist/bbhj_online.dylib
          for f in dist/*.dylib; do
            lipo -info "$f" || true
            if [ -n "$ENT" ]; then ldid -S"$ENT" "$f"; else ldid -S "$f"; fi
          done
          VER=$(sed -n 's/.*kPluginVersion @"\([^"]*\)".*/\1/p' core/PluginInfo.h | head -1)
          [ -z "$VER" ] && VER=0.0
          cp -f dist/bbhj_online.dylib "dist/bbhj-online-$VER.dylib"
          # 安装说明塞进包里，别让人拿到 zip 不知道放哪
          printf 'LLL %s\n1. 删掉 Frameworks/ 下所有旧的 MaterialPackManager*.dylib\n2. 只放一份 bbhj_online.dylib（或 bbhj-online-%s.dylib，内容一样）\n3. 重签 / 注入后启动游戏\n' "$VER" "$VER" > "dist/安装说明.txt"
          ( cd dist && zip -qry "LLL-$VER-dylib.zip" . )
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: bbhj-online-2.5-universal
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Commit patched sources
        if: success() && github.event_name == 'push'
        run: |
          git config user.name  "lll-ci"
          git config user.email "lll-ci@users.noreply.github.com"
          git add -A
          git reset -q -- dist artifacts || true
          if git diff --cached --quiet; then echo "源码无变化"; else
            git commit -m "ci: materialize sources [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || true
          fi

      - name: Publish artifact copy
        if: success() && github.event_name == 'push'
        run: |
          set -uo pipefail
          mkdir -p artifacts
          cp -f dist/bbhj_online.dylib artifacts/bbhj_online.dylib
          cp -f dist/bbhj-online-*.dylib artifacts/ 2>/dev/null || true
          cp -f dist/LLL-*-dylib.zip artifacts/ 2>/dev/null || true
          git add -f artifacts
          if git diff --cached --quiet; then echo "产物无变化"; else
            git commit -m "artifacts: ${{ github.sha }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || true
          fi

      - name: Report log
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --log-failed > /tmp/f.log 2>&1 || \
            gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --log > /tmp/f.log 2>&1 || true
          { echo '```'; grep -nE "error:|fatal error|undefined symbol" /tmp/f.log | head -30; echo '---'; tail -20 /tmp/f.log; echo '```'; } > /tmp/b.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/b.md || true
